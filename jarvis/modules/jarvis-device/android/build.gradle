plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.conectfly.jarvis'
version = '1.0.0'

android {
  namespace "expo.modules.jarvisdevice"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  // Detector da palavra "Jarvis" 100% no aparelho (Picovoice Porcupine, Maven Central).
  implementation 'ai.picovoice:porcupine-android:4.0.2'
}
