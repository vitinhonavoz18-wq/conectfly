# Loteria Cursos — ambiente completo (n8n + PostgreSQL + engine + renderer).
#   docker compose up -d --build
# Portas publicadas só em 127.0.0.1 (não ficam expostas na rede).
# Serviço "mock-server" só sobe com o perfil "mock" (testes): docker compose --profile mock up -d
name: loteria-cursos

x-node-build: &node-build
  context: .
  dockerfile: docker/node-apps.Dockerfile
  args:
    NODE_IMAGE: ${NODE_IMAGE:-node:22-bookworm-slim}

# Banco da APLICAÇÃO usado pelo serviço migrate. Padrão: Postgres do Docker.
# Banco no Supabase? Defina MIGRATE_DATABASE_URL no .env (ver docs/SUPABASE_SETUP.md).
x-app-db-url: &app-db-url "${MIGRATE_DATABASE_URL:-postgres://${POSTGRES_USER:-loteria}:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@postgres:5432/${POSTGRES_DB:-loteria}}"

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-loteria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-loteria}
      N8N_DB_NAME: ${N8N_DB_NAME:-n8n}
      TZ: America/Bahia
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Aplica migrations + seeds e copia as configurações NÃO secretas do .env para system_settings.
  migrate:
    build: { <<: *node-build, target: migrate }
    image: loteria-cursos/migrate:local
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: *app-db-url
      ENABLE_REAL_INSTAGRAM_PUBLISH: ${ENABLE_REAL_INSTAGRAM_PUBLISH:-false}
      BRAND_NAME: ${BRAND_NAME:-}
      DEFAULT_CTA: ${DEFAULT_CTA:-}
      ENGINE_URL: ${ENGINE_URL:-http://engine:3001}
      RENDERER_URL: ${RENDERER_URL:-http://renderer:3000}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      META_GRAPH_HOST: ${META_GRAPH_HOST:-https://graph.instagram.com}
      META_GRAPH_API_VERSION: ${META_GRAPH_API_VERSION:-}
      META_IG_USER_ID: ${META_IG_USER_ID:-}
      LOTTERY_RESULT_POLL_INTERVAL_SECONDS: ${LOTTERY_RESULT_POLL_INTERVAL_SECONDS:-180}
      LOTTERY_RESULT_MAX_ATTEMPTS: ${LOTTERY_RESULT_MAX_ATTEMPTS:-10}
      MIN_SECONDS_BETWEEN_PUBLISHES: ${MIN_SECONDS_BETWEEN_PUBLISHES:-60}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}

  # Lottery Core API: fonte de resultados, validação, palpites, conferência, plano de conteúdo.
  engine:
    build: { <<: *node-build, target: engine }
    image: loteria-cursos/engine:local
    restart: unless-stopped
    environment:
      TZ: America/Bahia
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOTTERY_SOURCE: ${LOTTERY_SOURCE:-caixa}
      CAIXA_BASE_URL: ${CAIXA_BASE_URL:-}
      CAIXA_TIMEOUT_MS: ${CAIXA_TIMEOUT_MS:-15000}
      RENDERER_URL: ${RENDERER_URL:-http://renderer:3000}

  # Gera as artes (JPEG) e grava no Storage.
  renderer:
    build: { <<: *node-build, target: renderer }
    image: loteria-cursos/renderer:local
    restart: unless-stopped
    environment:
      TZ: America/Bahia
      LOG_LEVEL: ${LOG_LEVEL:-info}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:-social-media}
      PUBLIC_BASE_URL: ${RENDERER_PUBLIC_BASE_URL:-http://localhost:3000}
    volumes:
      - renders:/data/renders
    ports:
      - "127.0.0.1:${RENDERER_PORT:-3000}:3000"

  n8n:
    image: ${N8N_IMAGE:-docker.n8n.io/n8nio/n8n:2.41.5}
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      engine: { condition: service_healthy }
      renderer: { condition: service_healthy }
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${N8N_DB_NAME:-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-loteria}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?defina N8N_ENCRYPTION_KEY no .env (openssl rand -hex 32)}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_LISTEN_ADDRESS: 0.0.0.0
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-false}
      GENERIC_TIMEZONE: America/Bahia
      TZ: America/Bahia
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      # Os workflows NÃO leem variáveis de ambiente (configuração vem do banco; segredos das Credentials).
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_DIAGNOSTICS_ENABLED: ${N8N_DIAGNOSTICS_ENABLED:-false}
      N8N_VERSION_NOTIFICATIONS_ENABLED: ${N8N_VERSION_NOTIFICATIONS_ENABLED:-false}
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: ${EXECUTIONS_DATA_MAX_AGE:-336}
      N8N_LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/import/workflows:ro
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 20

  mock-server:
    profiles: ["mock"]
    build: { <<: *node-build, target: mock-server }
    image: loteria-cursos/mock-server:local
    environment:
      FIXTURES_DIR: /fixtures
    volumes:
      - ./fixtures:/fixtures:ro
    ports:
      - "127.0.0.1:${MOCK_PORT:-4010}:4010"

volumes:
  pgdata:
  n8n_data:
  renders:
